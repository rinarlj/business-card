name: Build LaTeX document
on:
  push:
    tags:
      - v1.**
      
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: card.tex

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: card.pdf